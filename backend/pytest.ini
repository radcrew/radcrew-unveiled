[pytest]
pythonpath = .
testpaths = app/tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# The quality gate makes real embedding calls, so it is opt-in rather than part
# of every run: `python -m pytest -m quality`.
addopts = -m "not quality"
markers =
    quality: retrieval quality gate; needs a working embedding provider
