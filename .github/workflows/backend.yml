# Backend CI/CD (FastAPI) — Vercel project root is ./backend (app/main.py)
#
# Required GitHub secrets:
#   VERCEL_TOKEN
#   VERCEL_ORG_ID
#   VERCEL_BACKEND_PROJECT_ID
#
# Configure env vars (HF_TOKEN, FRONTEND_ORIGINS, etc.) in the Vercel backend project.

name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # pgvector's own image: the runner ships PostgreSQL, but without the vector
      # extension, so CREATE EXTENSION vector would fail on it. Only the
      # vector-store integration test uses this; the main suite runs with no
      # DATABASE_URL and must stay that way.
      #
      # No credentials, here or in repository settings. The container is created
      # for this job, listens only on the runner's loopback, and is destroyed
      # with the job, so trust auth leaves nothing to store or leak. What remains
      # below is a hostname and a database name, neither of which is a secret.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: radcrew_unveiled
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest

      # Separate step, and deliberately not part of the run above: exporting
      # DATABASE_URL for the whole suite would flip every retrieval test onto
      # the store path. This is the only place the SQL meets a real server.
      - name: Vector store integration
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/radcrew_unveiled
        run: python -m pytest app/tests/test_vector_store.py

      - name: Syntax check
        run: python -m compileall -q app

  deploy:
    needs: ci
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
          working-directory: ./backend
          vercel-version: latest
          github-comment: ${{ github.event_name == 'pull_request' }}
          vercel-args: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && '--prod' || '' }}
