# Frontend CI/CD (Vite) — deploys from repo root (see /vercel.json).
#
# Vercel dashboard (frontend project): set Root Directory to "." (repository root),
# not "frontend", so install can run `yarn install` against the root yarn.lock
# and resolve the frontend workspace.
#
# Required GitHub secrets (Vercel → Project → Settings → General):
#   VERCEL_TOKEN
#   VERCEL_ORG_ID
#   VERCEL_FRONTEND_PROJECT_ID

name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "package.json"
      - "yarn.lock"
      - "vercel.json"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "package.json"
      - "yarn.lock"
      - "vercel.json"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      # Yarn 1 ships with the runner image; the version is pinned by the root
      # package.json "packageManager" field, which Corepack honours.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium

      - name: E2E tests
        run: yarn test:e2e

      - name: Build
        run: yarn build

  deploy:
    needs: ci
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
          working-directory: .
          vercel-version: 54.2.0
          github-comment: ${{ github.event_name == 'pull_request' }}
          vercel-args: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && '--prod' || '' }}
